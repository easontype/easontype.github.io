<!doctype html>
<!-- og-default.png 的產生模板：playwright 以 1200x630 截圖 → public/og-default.png -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans+TC:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #ffffff; color: #14202e;
    font-family: "IBM Plex Sans TC", sans-serif;
    position: relative;
  }
  .trace {
    position: absolute; right: -30px; top: 40px;
  }
  .content {
    position: absolute; left: 96px; top: 0; height: 100%;
    display: flex; flex-direction: column; justify-content: center; gap: 28px;
    z-index: 1;
  }
  .brand-row { display: flex; align-items: center; gap: 18px; }
  .brand-row svg { width: 56px; height: 56px; }
  .brand-name {
    font-family: "Space Grotesk", "IBM Plex Sans TC", sans-serif;
    font-weight: 700; font-size: 40px;
  }
  h1 {
    font-family: "Space Grotesk", "IBM Plex Sans TC", sans-serif;
    font-weight: 600; font-size: 58px; line-height: 1.25;
    letter-spacing: -0.01em; max-width: 17em;
  }
  .url {
    font-family: "JetBrains Mono", monospace;
    font-size: 22px; color: #737f92;
  }
  .bar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 12px;
    background: linear-gradient(180deg, #2ea3e6, #1668b0);
  }
</style>
</head>
<body>
  <div class="bar"></div>
  <svg class="trace" width="560" height="420" viewBox="0 0 560 420" fill="none">
    <path d="M40 60 H240 V180 H420 V300 H560" stroke="#e7f2fb" stroke-width="4"/>
    <path d="M120 420 V240 H300 V120 H500" stroke="#cfe6f8" stroke-width="4"/>
    <circle cx="240" cy="180" r="10" fill="#e7f2fb" stroke="#cfe6f8" stroke-width="4"/>
    <circle cx="300" cy="120" r="10" fill="#ffffff" stroke="#2ea3e6" stroke-width="4"/>
    <circle cx="420" cy="300" r="10" fill="#e7f2fb" stroke="#cfe6f8" stroke-width="4"/>
    <circle cx="120" cy="420" r="8" fill="#cfe6f8"/>
    <circle cx="500" cy="120" r="8" fill="#2ea3e6" opacity="0.5"/>
  </svg>
  <div class="content">
    <div class="brand-row">
      <svg viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="11" r="9.5" stroke="#1668b0" stroke-width="1.5"/>
        <circle cx="11" cy="11" r="3" fill="#2ea3e6"/>
        <path d="M11 1.5v4M11 16.5v4M1.5 11h4M16.5 11h4" stroke="#cfe6f8" stroke-width="1.5"/>
      </svg>
      <span class="brand-name">AI八爪貓</span>
    </div>
    <h1>記錄 AI 工具、自動化實驗，<br />與一些技術筆記。</h1>
    <span class="url">easontype.github.io</span>
  </div>
</body>
</html>
